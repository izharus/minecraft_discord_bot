[project]
name = "minecraft-discord-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-mc-rcon>=3.4.2",
    "discord>=2.3.2",
    "loguru>=0.7.3",
]


[tool.black]
line-length = 79
target-version = ['py312']
extend-exclude = '''
(
  migrations   # Django DB migrations
)
'''


[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
skip_gitignore = true
skip_glob = ["**/migrations/*", "**/settings/*"]
src_paths = ["<your_code_dir>"]
known_third_party = ["access"]

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
